name: CI

# Require the stable "Required CI" check in the fork's branch protection.
# It is successful only when every static, test, browser, fidelity and SDK job succeeds.

on:
  push:
    branches: [main, codex/slideget-json-deckops]
  pull_request:
  workflow_dispatch:

# Cancel in-flight runs on the same ref so a fast-forward push doesn't spend
# minutes on stale CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Inherited unit tests supply browser globals; Node's experimental global
  # localStorage must not interfere with their explicit test environment.
  NODE_OPTIONS: --no-experimental-webstorage

jobs:
  # Cheap, single-version gate. Catches typing / lint / format violations before
  # the test matrix spins up.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # TEMPLATE: replace the toolchain setup below for non-Node stacks.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Type check CI runners
        run: pnpm exec tsc --project scripts/ci/tsconfig.json

      - name: Build
        run: pnpm build

      # The @office-kit/pptx-preview companion package type-checks and builds against
      # @office-kit/pptx's emitted types, so these run after the root build. It's a
      # separate workspace package with its own tsconfig / tsdown config.
      - name: Type check preview package
        run: pnpm --filter @office-kit/pptx-preview typecheck

      - name: Build preview package
        run: pnpm --filter @office-kit/pptx-preview build

      - name: Build DSL package
        run: pnpm --filter @office-kit/pptx-dsl build

      # Examples import the package's public exports, including its JSX runtime.
      - name: Type check DSL package
        run: pnpm --filter @office-kit/pptx-dsl typecheck

      - name: Type check editor package
        run: pnpm --filter @office-kit/pptx-editor typecheck

      # pptx-dev bundles the editor from this build.
      - name: Build editor package
        run: pnpm --filter @office-kit/pptx-editor build

      - name: Type check authoring tools
        run: pnpm --filter @office-kit/pptx-dev typecheck

      - name: Build authoring tools
        run: pnpm --filter @office-kit/pptx-dev build

      - name: Type check site
        run: pnpm --filter @office-kit/pptx-site check

  # Multi-version test matrix. Adapt the matrix to the runtimes the project
  # supports. Drop versions that are past their EOL date.
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    needs: static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['22', '24', '26']
        include:
          - os: windows-latest
            node-version: '24'
    steps:
      - uses: actions/checkout@v6

      - name: Fetch pinned schemas and reference corpus
        run: git submodule update --init --depth 1 references/ecma-376-5th references/PptxGenJS

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prove required XML validation infrastructure
        run: pnpm test:xml:infrastructure

      # Enables the inherited opt-in sample and core save/load smoke suites.
      # Reports are checked against source discovery; no skipped assertion passes.
      - name: Test all core, preview and DSL suites
        run: pnpm exec node scripts/ci/core-tests.ts
      - name: Build authoring packages
        run: pnpm --filter @office-kit/pptx-dev... build
      - name: Test TSX authoring and live preview
        run: pnpm exec node scripts/ci/node-tests.ts dev-unit
      - name: Test editor package
        run: pnpm exec node scripts/ci/node-tests.ts editor-unit

      - name: Upload test execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-node-${{ matrix.node-version }}-${{ matrix.os }}
          path: .probe/ci/
          if-no-files-found: error
          retention-days: 7

  # The browser suite takes ~46 min on one runner, so it is split by file
  # across parallel jobs. Files stay serial within a shard (as in
  # `test:browser`) because they share the runner's CPU with Chromium.
  browser:
    name: Browser tests (${{ matrix.shard }}/8)
    needs: static
    runs-on: ubuntu-latest
    # An upper bound: a stuck browser test otherwise runs until the 6 h
    # default before anyone sees its output.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build authoring packages
        run: pnpm --filter @office-kit/pptx-dev... build
      - name: Install preview test browser
        timeout-minutes: 20
        run: .github/scripts/retry.sh 360 pnpm --filter @office-kit/pptx-dev exec playwright install --with-deps chromium
      - name: Test live preview in Chromium
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: pnpm exec node scripts/ci/node-tests.ts dev-browser ${{ matrix.shard }}/8
      # The embedding tests are short; one shard runs them.
      - name: Test embedding the editor in Chromium
        if: matrix.shard == 1
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: pnpm exec node scripts/ci/node-tests.ts editor-browser

      - name: Upload browser execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.shard }}
          path: .probe/ci/
          if-no-files-found: error
          retention-days: 7

  # Measures how closely @office-kit/pptx-preview's SVG renderer matches LibreOffice's
  # output for each generated sample slide, and gates on a committed baseline.
  fidelity:
    name: Preview fidelity
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ground truth = LibreOffice PDF export rasterized by pdftoppm.
      # --no-install-recommends skips LibreOffice's font packages, so install
      # the metric-compatible families explicitly — they're the same ones
      # @office-kit/pptx-preview bundles (Carlito≈Calibri, Caladea≈Cambria,
      # Liberation≈Arial/Times/Courier). Without them LibreOffice falls back
      # to whatever fontconfig scrapes up and every text slide's fg-SSIM
      # collapses to ~0.
      - name: Install LibreOffice, poppler, and fonts
        timeout-minutes: 32
        run: >
          .github/scripts/retry.sh 600 bash -c 'sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libreoffice-impress poppler-utils
          fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation'

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build @office-kit/pptx
        run: pnpm build

      - name: Build preview package
        run: pnpm --filter @office-kit/pptx-preview build

      - name: Generate sample PPTX files
        run: pnpm samples

      - name: Run fidelity harness
        run: pnpm --filter @office-kit/pptx-site fidelity -- --check

      - name: Upload fidelity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fidelity-report
          path: site/fidelity/out/
          retention-days: 7
          if-no-files-found: error

      - name: Upload baseline candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fidelity-baseline-candidate
          path: site/fidelity/baseline.candidate.json
          retention-days: 7
          if-no-files-found: error

  # Secondary OOXML oracle. The test job validates XML against XSDs.
  # Even full XSD validation can't express the semantic
  # OOXML rules a desktop presentation app enforces before it calls a file corrupt. This job
  # runs the Open XML SDK's OpenXmlValidator over the generated decks as an
  # independent check. It GATES — CLAUDE.md treats invalid output as a bug, so a
  # real validation error must fail the build, not just warn.
  ooxml-oracle:
    name: OOXML validator (Open XML SDK)
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      # SDK feature band is pinned in tools/ooxml-validate/global.json so the
      # validator's rule set is reproducible.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tools/ooxml-validate/global.json

      - run: pnpm install --frozen-lockfile

      - name: Build @office-kit/pptx
        run: pnpm build

      - name: Generate sample PPTX files
        run: pnpm samples

      - name: Validate samples with OpenXmlValidator
        run: dotnet run --project tools/ooxml-validate -c Release -- samples/out

  required:
    name: Required CI
    if: always()
    needs: [static, test, browser, fidelity, ooxml-oracle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - name: Require every job and matrix member to succeed
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/required-check.ts
